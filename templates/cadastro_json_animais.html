<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de {{ categoria|capitalize }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="pagina-json-cadastro">
    <main class="container"> {# Changed div to main for semantic correctness #}

        {% if status %}
        <script>
            alert('{{ status }}');
        </script>
        {% endif %}

        <h1>Registro de {{ categoria|capitalize }}</h1>
        <p>Preencha os dados para integrar novas categorias ao sistema inteligente.</p>

        <form action="{{ url_for('json_animal', categoria=categoria) }}" method="post">
            <div class="form-group">
                <label for="nome">Nome do {{ categoria }}:</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Angus, Lote A, Cliente X" required>
            </div>

            <div class="button-container">
                <button type="button" onclick="window.location.href='{{ url_for('cadastros') }}'">Voltar aos Cadastros</button>
                <button type="submit">Adicionar {{ categoria|capitalize }}</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 - AI-Registro | Sistema de Gestão Inteligente de Gado | 
        <a href="{{ url_for('tos') }}">Termos de Serviço</a></p>
    </footer>
</body>

</html>
