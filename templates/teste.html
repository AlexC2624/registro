<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Enviar IDs selecionados</title>
</head>
<body>

  <h2>Selecione os animais</h2>

  <form action="/processar" method="POST">
    <table border="1">
      <thead>
        <tr>
          <th>Selecionar</th>
          <th>ID</th>
          <th>Nome</th>
        </tr>
      </thead>
      <tbody id="tabelaAnimais">
        <!-- Preenchido com JS -->
      </tbody>
    </table>

    <br>
    <button type="submit">Enviar selecionados</button>
  </form>

  <script>
    // Lista de listas: [id, nome]
    const animais = [
      [1, "Angus"],
      [2, "Nelore"],
      [3, "Guzerá"]
    ];

    const tabela = document.getElementById("tabelaAnimais");

    animais.forEach(function (animal) {
      const linha = document.createElement("tr");

      // Coluna 1 - checkbox
      const colCheck = document.createElement("td");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.name = "animaisSelecionados[]";
      checkbox.value = animal[0];  // ID
      colCheck.appendChild(checkbox);

      // Coluna 2 - ID
      const colId = document.createElement("td");
      colId.textContent = animal[0];

      // Coluna 3 - Nome
      const colNome = document.createElement("td");
      colNome.textContent = animal[1];

      linha.appendChild(colCheck);
      linha.appendChild(colId);
      linha.appendChild(colNome);
      tabela.appendChild(linha);
    });
  </script>

</body>
</html>
