<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Enviar IDs selecionados</title>
</head>
<body>

  <h2>Selecione os animais</h2>

  <form action="/teste" method="POST">
    <table border="1">
      <thead>
        <tr>
          <th>Selecionar</th>
          <th>ID</th>
          <th>Nome</th>
        </tr>
      </thead>
      <tbody id="tabelaAnimais">
        <!-- Criado via JS -->
      </tbody>
    </table>

    <br>
    <button type="submit">Enviar selecionados</button>
  </form>

  <script>
    // Exemplo de dados: lista de animais com ID e nome
    const animais = [
      { id: 1, nome: "Angus" },
      { id: 2, nome: "Nelore" },
      { id: 3, nome: "Guzerá" }
    ];

    const tabela = document.getElementById("tabelaAnimais");

    animais.forEach(function (animal) {
      const linha = document.createElement("tr");

      // Coluna 1 - checkbox com ID no value
      const colCheck = document.createElement("td");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.name = "animaisSelecionados[]";  // Enviado como lista
      checkbox.value = animal.id;
      colCheck.appendChild(checkbox);

      // Coluna 2 - ID
      const colId = document.createElement("td");
      colId.textContent = animal.id;

      // Coluna 3 - Nome
      const colNome = document.createElement("td");
      colNome.textContent = animal.nome;

      linha.appendChild(colCheck);
      linha.appendChild(colId);
      linha.appendChild(colNome);
      tabela.appendChild(linha);
    });
  </script>

</body>
</html>
