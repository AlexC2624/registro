<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tabela com Checkbox Dinâmico</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
    button {
      margin-top: 10px;
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <h2>Tabela com Checkbox na Primeira Coluna</h2>

  <table id="tabela">
    <thead>
      <tr>
        <th>
          <input type="checkbox" id="checkbox-mestre">
        </th>
        <th>Nome</th>
        <th>Idade</th>
      </tr>
    </thead>
    <tbody>
      <!-- Linhas serão preenchidas por JS -->
    </tbody>
  </table>

  <script>
    const dados = [
      { nome: "João", idade: 30 },
      { nome: "Maria", idade: 25 },
      { nome: "Carlos", idade: 35 }
    ];

    const tbody = document.querySelector("#tabela tbody");
    const checkboxMestre = document.getElementById("checkbox-mestre");

    function criarTabela() {
      dados.forEach((pessoa, index) => {
        const linha = document.createElement("tr");

        // Checkbox
        const colCheckbox = document.createElement("td");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.classList.add("linha-checkbox");
        checkbox.addEventListener("change", atualizarCheckboxMestre);
        colCheckbox.appendChild(checkbox);
        linha.appendChild(colCheckbox);

        // Nome
        const colNome = document.createElement("td");
        colNome.textContent = pessoa.nome;
        linha.appendChild(colNome);

        // Idade
        const colIdade = document.createElement("td");
        colIdade.textContent = pessoa.idade;
        linha.appendChild(colIdade);

        tbody.appendChild(linha);
      });
    }

    function marcarTodos() {
      document.querySelectorAll(".linha-checkbox").forEach(cb => cb.checked = true);
      checkboxMestre.checked = true;
    }

    function desmarcarTodos() {
      document.querySelectorAll(".linha-checkbox").forEach(cb => cb.checked = false);
      checkboxMestre.checked = false;
    }

    checkboxMestre.addEventListener("change", () => {
      if (checkboxMestre.checked) {
        marcarTodos();
      } else {
        desmarcarTodos();
      }
    });

    function atualizarCheckboxMestre() {
      const todos = document.querySelectorAll(".  -checkbox");
      const marcados = document.querySelectorAll(".linha-checkbox:checked");
      checkboxMestre.checked = todos.length === marcados.length;
    }

    criarTabela();
  </script>

</body>
</html>
