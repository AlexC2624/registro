<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Exemplo de Lista com Input</title>
</head>
<body>
  <label for="produto">Escolha um produto:</label>
  <select id="produto" name="produto">
    <option value="" disabled selected>Selecione...</option>
    <option value="milho" data-max="100">Milho (máximo 100)</option>
    <option value="soja" data-max="50">Soja (máximo 50)</option>
    <option value="ração" data-max="200">Ração (máximo 200)</option>
  </select>

  <br><br>

  <label for="quantidade">Quantidade:</label>
  <input type="number" id="quantidade" name="quantidade" min="1" required>

  <script>
    const selectProduto = document.getElementById("produto");
    const inputQuantidade = document.getElementById("quantidade");

    selectProduto.addEventListener("change", () => {
      const max = selectProduto.options[selectProduto.selectedIndex].dataset.max;
      inputQuantidade.max = max;
      inputQuantidade.value = ""; // limpa o campo para evitar valores inválidos
      inputQuantidade.placeholder = `Máx: ${max}`;
    });
  </script>
</body>
</html>
