<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastros - Sistema de Gestão de Gado de Corte</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="pagina-cadastros">
    <header>
        <h1>📋 Página de Cadastros</h1>
    </header>

    <main>
        <!-- Cadastro de Animais -->
        <section>
            <h2>🐮 Cadastro de Animais</h2>
            <form method="post" action="{{ url_for('cadastros') }}">
                <button type="submit" name="animal" value="entrada">➕ Entrada de Animais</button>
                <button type="submit" name="animal" value="saida">➖ Saída de Animais</button>
            </form>
        </section>

        <!-- Cadastro de Insumos -->
        <section>
            <h2>🌽 Cadastro de Insumos</h2>
            <form method="post" action="{{ url_for('cadastros') }}">
                <button type="submit" name="insumo" value="novo">➕ Novo Insumo</button>
                <button type="submit" name="insumo" value="compra">➕ Compra de Insumos</button>
            </form>
        </section>
        
        <!-- Manejo Animal  -->
        <section>
            <h2>🐄 Manejo Animal</h2>
            <form method="post" action="{{ url_for('cadastros') }}">
                <button type="submit" name="manejo" value="alimentacao">🍽️ Registrar Alimentação</button>
                <!-- <button type="submit" name="manejo" value="pesagem">⚖️ Registrar Pesagem</button> -->
                <!-- <button type="submit" name="manejo" value="movimentacao">➡️ Movimentar Animais</button> -->
                <!-- Para registrar ocorrências fora de padrões como um LOG -->
                <!-- <button type="submit" name="manejo" value="ocorrencias">📝 Registrar Ocorrência</button> -->
            </form>
        </section>

        <!-- Saúde Animal: vacinas, visita de veterinária -->

        <!-- Cadastros Complementares -->
        <section>
            <h2>🧾 Cadastros Complementares</h2>
            <form method="post" action="{{ url_for('cadastros') }}">
                <button type="submit" name="json_categoria" value="lote">📦 Cadastro de Lote</button>
                
                <button type="submit" name="json_categoria" value="raca">🐂 Cadastro de Raça</button>
                
                <button type="submit" name="json_categoria" value="fornecedor">🚜 Cadastro de Fornecedor</button>
                
                <button type="submit" name="json_categoria" value="insumo">🧪 Cadastro de Insumo</button>

                <button type="submit" name="json_categoria" value="cliente">👤 Cadastro de Cliente</button>
            </form>
        </section>

        <!-- Voltar -->
        <section>
            <form method="get" action="{{ url_for('index') }}">
                <button type="submit">⬅️ Voltar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 - Sistema de Gestão de Gado de Corte | <a href="{{ url_for('tos') }}">Termos de Serviço</a></p>
    </footer>
</body>
</html>
