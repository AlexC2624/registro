<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de {{ 'Compra' if modo == 'compra' else 'Consumo' }} de Insumo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        {% if status %}
        <script>
            alert('{{ status }}');
            window.history.back();
        </script>
        {% endif %}

        {% if modo == 'compra' %}
        <h1>Cadastro de Compra de Insumo</h1>
        <form action="{{ url_for('insumo', modo=modo) }}" method="POST">
            <label for="insumo">Insumo:</label>
            <select name="insumo" id="insumo">
                {% for item in insumo_opcoes %}
                <option value="{{ item }}">{{ item }}</option>
                {% endfor %}
            </select>

            <label for="fornecedor">Fornecedor:</label>
            <select name="fornecedor" id="fornecedor">
                {% for item in fornecedor_opcoes %}
                <option value="{{ item }}">{{ item }}</option>
                {% endfor %}
            </select>

            <label for="data">Data da Compra:</label>
            <input type="date" id="data" name="data" required>

            <label for="quantidade">Quantidade:</label>
            <input type="number" step="0.1" id="quantidade" name="quantidade" required>

            <label for="valor_unitario">Valor Unitário (R$):</label>
            <input type="number" step="0.01" id="valor_unitario" name="valor_unitario" required>

            <div class="button-container">
                <button type="button" onclick="window.location.href='{{ url_for('cadastros') }}'">Voltar</button>
                <button type="submit">Cadastrar</button>
            </div>
        </form>
        {% endif %}

        {% if modo == 'consumo' %}
        <h1>Cadastro de Consumo de Insumo</h1>
        <form action="{{ url_for('insumo', modo=modo) }}" method="POST">
            <label for="insumo">Insumo:</label>
            <select name="insumo" id="insumo">
                {% for item in insumo_opcoes %}
                <option value="{{ item }}">{{ item }}</option>
                {% endfor %}
            </select>

            <label for="data">Data do Consumo:</label>
            <input type="date" id="data" name="data" required>

            <label for="quantidade">Quantidade:</label>
            <input type="number" step="0.1" id="quantidade" name="quantidade" required>

            <label for="obs">Observação:</label>
            <input type="text" id="obs" name="obs">

            <div class="button-container">
                <button type="button" onclick="window.location.href='{{ url_for('cadastros') }}'">Voltar</button>
                <button type="submit">Cadastrar</button>
            </div>
        </form>
        {% endif %}
    </div>
</body>

</html>
