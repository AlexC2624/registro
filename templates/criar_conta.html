<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo ao Sistema IA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="pagina-index">
    <div class="container">
        <header>
            <h1>Seu Portal para o Futuro: Gerenciamento Inteligente e Conectado</h1>
        </header>

        <main class="container">
            <fieldset>
                <legend>Acesse o Sistema</legend>
                <form id="registroForm" action="{{ url_for('criar_conta') }}" method="POST">
                    <div class="form-group">
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Senha:</label>
                        <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Confirme a Senha:</label>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirme sua senha" required>
                    </div>
                    <div id="password-error" class="senhas-diferentes"></div>
                    <div id="password-strength"></div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="text" id="email" name="email" placeholder="Digite seu email" required>
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone:</label>
                        <input type="text" id="telefone" name="telefone" placeholder="Digite seu telefone" required>
                    </div>
                    <div class="form-group">
                        <label for="estado">Estado:</label>
                        <input type="text" id="estado" name="estado" placeholder="Digite seu estado" required>
                    </div>
                    <div class="form-group">
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade" required>
                    </div>
                    <div class="form-group">
                        <label for="comunidade">Comunicade:</label>
                        <input type="text" id="comunidade" name="comunidade" placeholder="Digite sua comunidade" required>
                    </div>
                    {% if error %}
                    <p class="error-message">{{ error }}</p>
                    {% endif %}
                    <div class="button-container">
                        <button type="submit" name="button" value="criar">Criar</button>
                    </div>
                </form>
            </fieldset>
        </main>
    </div>
    <footer>
        <p>&copy; 2025 - AI-Registro | Sistema de Gestão Inteligente de Gado | 
            <a href="{{ url_for('tos') }}">Termos de Serviço</a></p>
        </footer>
    </body>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Seleciona os campos e os elementos de feedback
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirm_password');
            const passwordStrengthDiv = document.getElementById('password-strength');
            const passwordErrorDiv = document.getElementById('password-error');
            const form = document.getElementById('registroForm');

            // Função para verificar o nível da senha
            function checkPasswordStrength(password) {
                let strength = 0;
                
                // Critério 1: Comprimento maior que 8
                if (password.length >= 8) {
                    strength++;
                }
                // Critério 2: Letra minúscula
                if (password.match(/[a-z]/)) {
                    strength++;
                }
                // Critério 3: Letra maiúscula
                if (password.match(/[A-Z]/)) {
                    strength++;
                }
                // Critério 4: Número
                if (password.match(/[0-9]/)) {
                    strength++;
                }
                // Critério 5: Caractere especial
                if (password.match(/[^a-zA-Z0-9]/)) {
                    strength++;
                }
                
                return strength;
            }

            // Função para atualizar o feedback do nível da senha
            function updatePasswordStrengthDisplay() {
                const strength = checkPasswordStrength(passwordInput.value);
                let strengthText = '';
                let strengthColor = '';

                if (passwordInput.value.length === 0) {
                    strengthText = '';
                } else if (strength <= 2) {
                    strengthText = 'Fraca';
                    strengthColor = 'red';
                } else if (strength <= 4) {
                    strengthText = 'Média';
                    strengthColor = 'orange';
                } else {
                    strengthText = 'Forte';
                    strengthColor = 'green';
                }

                passwordStrengthDiv.textContent = strengthText;
                passwordStrengthDiv.style.color = strengthColor;
            }

            // Função para validar se as senhas coincidem
            function validatePasswordMatch() {
                if (confirmPasswordInput.value.length > 0 && passwordInput.value !== confirmPasswordInput.value) {
                    passwordErrorDiv.textContent = 'As senhas não coincidem.';
                    passwordErrorDiv.style.color = 'red';
                    return false;
                } else {
                    passwordErrorDiv.textContent = '';
                    return true;
                }
            }

            // Adiciona ouvintes de evento para validação em tempo real
            passwordInput.addEventListener('keyup', updatePasswordStrengthDisplay);
            passwordInput.addEventListener('keyup', validatePasswordMatch);
            confirmPasswordInput.addEventListener('keyup', validatePasswordMatch);

            // Validação final no momento do envio do formulário
            form.addEventListener('submit', function(event) {
                if (!validatePasswordMatch()) {
                    event.preventDefault();
                }
            });
        });
        document.addEventListener('submit', function(event) {
            if (!validatePasswordMatch()) {
                event.preventDefault();
            };
        });
    </script>
    </html>
