<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo ao Sistema IA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="pagina-index">
    <div class="container">
        <header>
            <h1>Seu Portal para o Futuro: Gerenciamento Inteligente e Conectado</h1>
        </header>

        <main class="container">
            <fieldset>
                <legend>Acesse o Sistema</legend>
                <form action="{{ url_for('index') }}" method="POST">
                    <div class="form-group">
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Senha:</label>
                        <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                    </div>
                    <div class="form-group">
                        <label for="username">Email:</label>
                        <input type="text" id="username" name="username" placeholder="Digite seu email" required>
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone:</label>
                        <input type="text" id="telefone" name="telefone" placeholder="Digite seu telefone" required>
                    </div>
                    <div class="form-group">
                        <label for="estado">Estado:</label>
                        <input type="text" id="estado" name="estado" placeholder="Digite seu estado" required>
                    </div>
                    <div class="form-group">
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade" required>
                    </div>
                    <div class="form-group">
                        <label for="comunidade">Comunicade:</label>
                        <input type="text" id="comunidade" name="comunidade" placeholder="Digite sua comunidade" required>
                    </div>
                    {% if error %}
                        <p class="error-message">{{ error }}</p>
                    {% endif %}
                    <div class="button-container">
                        <button type="submit" name="button" value="criar">Criar</button>
                    </div>
                </form>
            </fieldset>
        </main>

    </div>
    <footer>
        <p>&copy; 2025 - AI-Registro | Sistema de Gestão Inteligente de Gado | 
        <a href="{{ url_for('tos') }}">Termos de Serviço</a></p>
    </footer>
</body>
</html>
