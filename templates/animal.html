<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de {{ 'Entrada' if modo == 'entrada' else 'Saída' }} de Animal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="pagina-animal">
    <main class="container">
        {% if status %}
        <script>
            alert('{{ status }}');
            window.history.back();
        </script>
        {% endif %}

        {% if modo == 'entrada' %}
        <section>
            <h1>🐮 Cadastro de Entrada de Animal</h1>
            <form action="{{ url_for('animal', modo=modo) }}" method="post">

                <label for="lote">Lote:</label>
                <select name="lote" id="lote" required>
                    {% for item in lote_opcoes %}
                    <option value="{{ item }}">{{ item }}</option>
                    {% endfor %}
                </select>

                <label for="raca">Raça:</label>
                <select name="raca" id="raca" required>
                    {% for item in raca_opcoes %}
                    <option value="{{ item }}">{{ item }}</option>
                    {% endfor %}
                </select>

                <label for="data_nascimento">Data de Nascimento:</label>
                <input type="date" id="data_nascimento" name="data_nascimento" required>

                <label for="fornecedor">Fornecedor:</label>
                <select name="fornecedor" id="fornecedor" required>
                    {% for item in fornecedor_opcoes %}
                    <option value="{{ item }}">{{ item }}</option>
                    {% endfor %}
                </select>

                <label for="data_entrada">Data de Entrada:</label>
                <input type="date" id="data_entrada" name="data_entrada" required>

                <label for="peso_entrada">Peso na Entrada (kg):</label>
                <input type="number" id="peso_entrada" name="peso_entrada" value="250" step="1" required>

                <label for="valor_entrada">Valor na Entrada (R$):</label>
                <input type="number" id="valor_entrada" name="valor_entrada" value="8" step="0.1" required>

                <div class="button-container">
                    <button type="button" onclick="window.location.href='{{ url_for('cadastros') }}'">⬅️ Voltar</button>
                    <button type="submit">✅ Cadastrar</button>
                </div>
            </form>
        </section>
        {% endif %}

        {% if modo == 'saida' %}
        <section>
            <h1>📤 Cadastro de Saída de Animal</h1>
            <form action="{{ url_for('animal', modo=modo) }}" method="post">

                <label for="lote_entrada">Lote de entrada:</label>
                <select id="lote_entrada" name="lote_entrada" required>
                    <option value="">Selecione um lote cadastrado</option>
                    {% for item in lote_opcoes %}
                    <option value="{{ item }}">{{ item }}</option>
                    {% endfor %}
                </select>

                <label for="animais_entrada">Animais no Lote:</label>
                <select id="animais_entrada" name="animais_entrada" required>
                    <option value="">Selecione um lote primeiro</option>
                    <!-- As opções serão preenchidas via JavaScript -->
                </select>

                <label for="cliente">Cliente:</label>
                <select name="cliente" id="cliente" required>
                    {% for cliente in cliente_opcoes %}
                    <option value="{{ cliente }}">{{ cliente }}</option>
                    {% endfor %}
                </select>

                <label for="data_saida">Data de Saída:</label>
                <input type="date" id="data_saida" name="data_saida" required>

                <label for="peso_saida">Peso de Saída (kg):</label>
                <input type="number" id="peso_saida" name="peso_saida" value="450" step="1" required>

                <label for="valor_saida">Valor de Saída (R$):</label>
                <input type="number" id="valor_saida" name="valor_saida" value="9" step="0.1" required>

                <div class="button-container">
                    <button type="button" onclick="window.location.href='{{ url_for('cadastros') }}'">⬅️ Voltar</button>
                    <button type="submit">✅ Cadastrar</button>
                </div>
            </form>
        </section>
        {% endif %}
    </main>

    <footer>
        <p>&copy; 2025 - Sistema de Gestão de Gado de Corte | 
        <a href="{{ url_for('tos') }}">Termos de Serviço</a></p>
    </footer>

    <p id="resultado">Resultado: </p>

    <script>
        // Dados: categorias e suas opções
        const dados = {
            "Frutas": ["Maçã", "Banana", "Laranja", "Uva"],
            "Legumes": ["Cenoura", "Batata", "Abobrinha", "Chuchu"],
            "Verduras": ["Alface", "Rúcula", "Couve", "Espinafre"]
        };

        const loteEntrada = document.getElementById("lote_entrada");
        const animaisEntrada = document.getElementById("animais_entrada");
        const resultado = document.getElementById("resultado");

        for (let lote in dados) {
            let option = document.createElement("option");
            option.value = lote;
            option.text = lote;
            loteEntrada.add(option);
        }

        loteEntrada.addEventListener('change', function () {
            const selecionado = this.value;

            // Limpa a sublista atual
            animaisEntrada.innerHTML = '<option value="">-- Selecione --</option>';

            if (selecionado && dados[selecionado]) {
                dados[selecionado].forEach(function (animal) {
                    let opt = document.createElement("option");
                    opt.value = animal.toLowerCase();
                    opt.text = animal;
                    animaisEntrada.add(opt);
                });
            }
            resultado.textContent = ""; // Limpa resultado
        });
        animaisEntrada.addEventListener('change', function () {
            if (this.value) {
                resultado.textContent = "Resultado: " + this.value;
            } else {
                resultado.textContent = "Resultado: ";
            }
        });
    </script>
</body>

</html>
